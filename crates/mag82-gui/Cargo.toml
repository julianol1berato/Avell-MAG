[package]
name = "mag82-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Autoteste da interface (variável MAG82_TESTE): exercita as telas e grava no teclado. Fica fora
# dos pacotes; a integração contínua o roda contra o teclado simulado (MAG82_SIMULADO).
autoteste = []

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
futures-channel = "0.3"
libc = "0.2.191"
serde_json = "1"
sha2 = "0.10"
ureq = "2"
mag82 = { version = "0.1.0", path = "../mag82" }
