name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release --locked
      - name: Testes
        run: cargo test --release --locked
      # O que cada tipo de tecla avançada aceita, contra as respostas medidas no teclado de verdade
      # (crates/mag82/src/avancadas-medidas.txt). Já roda nos testes acima; fica à parte para a
      # falha aparecer com nome quando alguém libera uma função que o teclado recusa.
      - name: Funções aceitas nas teclas avançadas
        run: |
          cargo test --release --locked -p mag82 tabela_do_teclado
          cargo test --release --locked -p mag82 toda_funcao_do_catalogo_foi_medida
          cargo test --release --locked -p mag82 avancada
          cargo test --release --locked -p mag82-cli avancadas_recusam_funcoes_especiais
      - name: Interface contra o teclado simulado
        run: scripts/teste-interface.sh telas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: |
            telas/*.png
            telas/saida.txt

  deb:
    name: Pacote .deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev dpkg-dev lintian
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gerar o .deb
        run: packaging/deb.sh
      - name: Conferir o pacote
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          lintian --no-tag-display-limit dist/*.deb || true
      - name: Instalar o pacote
        run: sudo apt-get install -y ./dist/*.deb xvfb dbus desktop-file-utils
      - name: Teste de fumaça como usuário comum
        run: scripts/teste-fumaca.sh
      - name: Gerar o .tar.gz (atualização das instalações em ~/.local)
        run: packaging/tar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/*.tar.gz

  # O .rpm é compilado no Fedora mais antigo ainda mantido: um pacote feito lá instala nos mais
  # novos, e o contrário não vale. O trabalho seguinte confere isso instalando nos outros.
  rpm:
    name: Pacote .rpm (Fedora 43)
    runs-on: ubuntu-24.04
    needs: testes
    container: fedora:43
    steps:
      - name: Dependências
        run: |
          dnf install -y git tar gzip rpm-build cargo rust gcc gtk4-devel libadwaita-devel \
            systemd-rpm-macros desktop-file-utils
      - uses: actions/checkout@v4
      - name: Gerar o .rpm (compila e roda os testes)
        run: packaging/rpm.sh
      - name: Conferir o pacote
        run: |
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  rpm-instala:
    name: Instalar o .rpm (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-24.04
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44", "latest"]
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Dependências do teste
        run: |
          dnf install -y git desktop-file-utils xorg-x11-server-Xvfb xauth dbus-daemon mesa-dri-drivers \
            util-linux sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist
      - name: Instalar o pacote
        run: dnf install -y ./dist/*.rpm
      - name: Teste de fumaça como usuário comum
        run: |
          useradd -m usuario
          cp scripts/teste-fumaca.sh /tmp/teste-fumaca.sh && chmod 755 /tmp/teste-fumaca.sh
          runuser -u usuario -- bash -c 'cd ~ && /tmp/teste-fumaca.sh'

  versao:
    name: Publicar a versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, rpm-instala]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Criar a versão com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pacotes/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
